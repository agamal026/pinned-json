[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinned-json"
version = "0.1.1"
description = "Verify and emit exact JSON fixtures from a trusted hash-pinned allowlist."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "agamal026"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
pinned-json = "pinned_json.__main__:main"

[project.urls]
Repository = "https://github.com/agamal026/pinned-json"
Issues = "https://github.com/agamal026/pinned-json/issues"

[tool.setuptools.packages.find]
where = ["src"]
